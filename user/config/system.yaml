home:
  alias: '/home'

pages:
  theme: maw-starter
  markdown_output:
    enabled: true
    frontmatter: true
    links: true
    max_links: 100
    absolute_urls: true
    token_header: true

cache:
  enabled: true
  check:
    method: file

assets:
  css_pipeline: false
  js_pipeline: false
  enable_asset_timestamp: false

errors:
  display: true
  log: true

debugger:
  enabled: false
  provider: clockwork

gpm:
  releases: stable
  verify_peer: true

updates:
  safe_upgrade: true
  safe_upgrade_snapshot_limit: 5
