title: Contact
description: Contact details beside a Form plugin form. `form` is the name of a form under `forms:` in the same page frontmatter.
icon: fa-envelope
example:
  type: contact
  heading: Get in touch
  text: We reply within one business day.
  form: contact
  details:
    - { icon: 'fa-envelope', label: Email, value: hello@example.com, url: 'mailto:hello@example.com' }
form:
  fields:
    .eyebrow: { type: text, label: Eyebrow }
    .heading: { type: text, label: Heading }
    .text: { type: markdown, label: Text }
    .form:
      type: text
      label: Form name
      help: Name of a form defined under `forms:` in this page's frontmatter (Expert mode).
      default: contact
    .details:
      type: list
      label: Contact details
      style: vertical
      fields:
        .icon: { type: iconpicker, label: Icon }
        .label: { type: text, label: Label }
        .value: { type: text, label: Value }
        .url: { type: text, label: 'Link (mailto:, tel:, https:)' }
