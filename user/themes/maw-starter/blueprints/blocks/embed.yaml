title: Embed
description: Responsive iframe for YouTube, Vimeo, maps or any https URL. Ratio like "16 / 9" or "4 / 3".
icon: fa-play
example:
  type: embed
  heading: Watch the demo
  url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
  ratio: 16 / 9
form:
  fields:
    .eyebrow: { type: text, label: Eyebrow }
    .heading: { type: text, label: Heading }
    .intro: { type: textarea, label: Intro (markdown), rows: 2 }
    .url: { type: text, label: URL }
    .title: { type: text, label: Accessible title }
    .ratio: { type: text, label: Aspect ratio, default: 16 / 9, size: small }
    .caption: { type: text, label: Caption }
