title: Logos
description: Row of client/partner logos (grayscale until hover). Name is shown as text when no image.
icon: fa-building
example:
  type: logos
  heading: Trusted by teams at
  items:
    - { name: Acme, image: acme.svg, url: 'https://example.com' }
form:
  fields:
    .heading: { type: text, label: Heading }
    .items:
      type: list
      label: Logos
      style: vertical
      collapsed: true
      fields:
        .name: { type: text, label: Name }
        .image: { type: filepicker, label: Logo, preview_images: true, accept: ['image/*'] }
        .url: { type: text, label: Link URL }
