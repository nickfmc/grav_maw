title: Spacer
description: Vertical space with optional divider line. Ignores shared section settings except class.
icon: fa-arrows-up-down
category: layout
example:
  type: spacer
  size: md
  divider: true
form:
  fields:
    .size:
      type: select
      label: Size
      default: md
      options: { sm: Small, md: Medium, lg: Large }
    .divider:
      type: toggle
      label: Show divider
      default: 0
      options: { 1: PLUGIN_ADMIN.YES, 0: PLUGIN_ADMIN.NO }
      validate: { type: bool }
