title: Pricing
description: Pricing plans with features (one per line), button, and an optional featured plan.
icon: fa-tags
example:
  type: pricing
  heading: Simple pricing
  items:
    - { name: Starter, price: '$29', period: /mo, description: For small sites., features: "5 pages\nSSL", button_label: Choose, button_url: /contact }
    - { name: Pro, price: '$79', period: /mo, featured: true, badge: Popular, features: "Unlimited pages\nPriority support", button_label: Choose, button_url: /contact }
form:
  fields:
    .eyebrow: { type: text, label: Eyebrow }
    .heading: { type: text, label: Heading }
    .intro: { type: textarea, label: Intro (markdown), rows: 2 }
    .items:
      type: list
      label: Plans
      style: vertical
      collapsed: true
      fields:
        .name: { type: text, label: Plan name }
        .badge: { type: text, label: Badge }
        .price: { type: text, label: Price }
        .period: { type: text, label: Period (e.g. /mo) }
        .description: { type: text, label: Description }
        .features: { type: textarea, label: Features (one per line), rows: 4 }
        .button_label: { type: text, label: Button label }
        .button_url: { type: text, label: Button URL }
        .featured:
          type: toggle
          label: Featured
          default: 0
          options: { 1: PLUGIN_ADMIN.YES, 0: PLUGIN_ADMIN.NO }
          validate: { type: bool }
