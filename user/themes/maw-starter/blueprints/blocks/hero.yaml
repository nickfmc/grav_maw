title: Hero
description: Large intro section with headline, text, buttons and optional image. First hero on a page uses <h1>.
icon: fa-star
example:
  type: hero
  layout: split
  eyebrow: New
  heading: Build faster with Grav
  text: A flat-file CMS your team and your AI agents can both work with.
  image: hero.jpg
  image_alt: Product screenshot
  buttons:
    - { label: Get started, url: /contact, style: primary }
    - { label: Learn more, url: '#features', style: secondary }
form:
  # Adds the shared .buttons list (blueprints/blocks/_buttons.yaml) after the fields below
  import@: { type: blocks/_buttons, context: 'theme://blueprints' }
  fields:
    .layout:
      type: select
      label: Layout
      default: split
      options: { split: Text + image, centered: Centered text, background: Image background }
    .eyebrow: { type: text, label: Eyebrow }
    .heading: { type: text, label: Heading }
    .text: { type: textarea, label: Text (markdown), rows: 3 }
    .image: { type: filepicker, label: Image, preview_images: true, accept: ['image/*'] }
    .image_alt: { type: text, label: Image alt text }
