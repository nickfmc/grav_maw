# Shared settings every block supports (rendered by templates/blocks/_section.html.twig).
# Imported once per list item in blueprints/partials/blocks-field.yaml.
form:
  fields:
    .anchor:
      type: text
      label: Anchor ID
      help: 'For in-page links, e.g. "pricing" -> /page#pricing'
      size: medium
    .background:
      type: select
      label: Background
      default: none
      options: { none: None, alt: Subtle gray, soft: Accent tint, accent: Accent, dark: Dark }
    .bg_color:
      type: colorpicker
      label: Custom background color
      help: 'Hex color such as #0f766e. Overrides the Background preset.'
    .text_color:
      type: select
      label: Text color
      default: auto
      help: Used with a custom background. Auto picks light or dark text for contrast.
      options: { auto: Auto, light: Light, dark: Dark }
    .spacing:
      type: select
      label: Vertical spacing
      default: md
      options: { none: None, sm: Small, md: Medium, lg: Large }
    .width:
      type: select
      label: Content width
      default: default
      options: { narrow: Narrow, default: Default, wide: Wide, full: Full bleed }
    .align:
      type: select
      label: Alignment
      default: left
      options: { left: Left, center: Center }
    .class:
      type: text
      label: Extra CSS classes
    .reveal:
      type: toggle
      label: Fade in on scroll
      highlight: 1
      default: 0
      options: { 1: PLUGIN_ADMIN.YES, 0: PLUGIN_ADMIN.NO }
      validate: { type: bool }
    .hidden:
      type: toggle
      label: Hide this block
      highlight: 0
      default: 0
      options: { 1: PLUGIN_ADMIN.YES, 0: PLUGIN_ADMIN.NO }
      validate: { type: bool }
    .hide_on:
      type: checkboxes
      label: Hide on devices
      help: 'Mobile up to 640px, tablet 641-960px, desktop above 960px.'
      options: { mobile: Mobile, tablet: Tablet, desktop: Desktop }
      use: keys
      validate: { type: commalist }
