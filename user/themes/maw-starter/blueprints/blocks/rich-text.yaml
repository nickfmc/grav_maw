title: Rich text
description: Markdown content section with optional heading and buttons. Narrow width by default.
icon: fa-align-left
category: content
example:
  type: rich-text
  heading: About us
  text: |
    We build **fast** websites.

    - Point one
    - Point two
form:
  # Adds the shared .buttons list (blueprints/blocks/_buttons.yaml) after the fields below
  import@: { type: blocks/_buttons, context: 'theme://blueprints' }
  fields:
    .eyebrow: { type: text, label: Eyebrow }
    .heading: { type: text, label: Heading }
    .text: { type: markdown, label: Content }
    .wide:
      type: toggle
      label: Full container width
      default: 0
      options: { 1: PLUGIN_ADMIN.YES, 0: PLUGIN_ADMIN.NO }
      validate: { type: bool }
