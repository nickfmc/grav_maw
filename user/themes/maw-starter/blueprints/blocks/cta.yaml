title: Call to action
description: Centered heading, text and buttons on an accent background (change with background setting).
icon: fa-bullhorn
example:
  type: cta
  heading: Ready to start?
  text: Tell us about your project.
  buttons:
    - { label: Contact us, url: /contact }
form:
  # Adds the shared .buttons list (blueprints/blocks/_buttons.yaml) after the fields below
  import@: { type: blocks/_buttons, context: 'theme://blueprints' }
  fields:
    .eyebrow: { type: text, label: Eyebrow }
    .heading: { type: text, label: Heading }
    .text: { type: textarea, label: Text (markdown), rows: 2 }
